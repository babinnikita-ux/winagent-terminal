name: Bug report
description: Report a reproducible WinAgent Terminal defect.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not report security vulnerabilities here; see SECURITY.md."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WinAgent version or commit
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options: ["Windows 10", "Windows 11", "Other"]
